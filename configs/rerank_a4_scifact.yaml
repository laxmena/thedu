# Same reranker settings as configs/rerank_scifact.yaml. Run overnight under caffeinate with a completion notice.
dataset: scifact
split: dev
setups: [A4, A4R]
bm25: {k1: 0.9, b: 0.4}
dense: {model: Qwen/Qwen3-Embedding-0.6B, max_seq_length: 512}
