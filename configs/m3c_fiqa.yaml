# M3c: FiQA dev, the clean test of the pre-registered router (configs/router.yaml, frozen before this run).
# Fresh rewrites from the pinned provider (DeepInfra, fp8); no spike cache.
dataset: fiqa
split: dev
setups: [A0, A3, A4, H0, A5]
bm25: {k1: 0.9, b: 0.4}
dense: {model: Qwen/Qwen3-Embedding-0.6B, max_seq_length: 512}   # query_instruction defaults to the MTEB task instruction
llm:
  model: qwen/qwen3-14b
  temperature: 0.0
  seed: 7
  max_tokens: 300
  provider: {order: [DeepInfra], allow_fallbacks: false}
planner: {grounded_prompt: grounded_v1, query_repeat: 3, feedback_k: 5, use_spike_cache: false}
ranker: {rrf_k: 60, depth: 100}
