[project]
name = "thedu"
version = "0.0.1"
description = "Query-time LLM rewriting over BM25 vs embeddings: a research experiment"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "bm25s>=0.2",
    "PyStemmer>=2.2",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "sentence-transformers>=3.0",
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pytest>=8.0",
    "pytrec_eval>=0.5",
]

[project.scripts]
thedu = "thedu.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thedu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["smoke: slower end-to-end checks, run by `thedu smoke`"]
